# Optional secret holding the values referenced by the deployment:
#   OPENTELEMETRY_COLLECT_AUTHORIZATION_HEADER — Bearer token for otel-light ingestion
#   NOTIFICATIONS_API / NOTIFICATIONS_TOKEN    — notifications integration (alerts stay
#                                                silent when unset)
#   PROBE_API_SECRET_TOKEN                     — any ${ENV} placeholder used in probes.yaml
# Replace the placeholder values before applying (the GitOps repository holds
# the real values for cluster rollouts).
apiVersion: v1
kind: Secret
metadata:
  name: synthetic-monitor-secret
type: Opaque
stringData:
  OPENTELEMETRY_COLLECT_AUTHORIZATION_HEADER: "REPLACE_ME"
  NOTIFICATIONS_API: ""
  NOTIFICATIONS_TOKEN: ""
  PROBE_API_SECRET_TOKEN: "REPLACE_ME"
